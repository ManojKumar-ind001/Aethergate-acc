services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accountbridge
      POSTGRES_USER: accountbridge
      POSTGRES_PASSWORD: change_me_in_production
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./src/backend/database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    ports:
      - "5432:5432"

  accountbridge:
    build: .
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DATABASE_URL: postgres://accountbridge:change_me_in_production@postgres:5432/accountbridge

volumes:
  pg_data:
